name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::warning::go.mod or go.sum changed after 'go mod tidy'; commit the result"; true)
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - run: go vet ./...
      - name: rclone, for the off-site backup tests
        run: sudo apt-get update && sudo apt-get install -y rclone
      - run: go test -race ./...
      - run: make build fakeconsole
      - name: Console join smoke test
        run: sh scripts/smoke.sh
      - name: Console join smoke test with the race detector
        run: |
          go build -race -o blockparty-race ./cmd/blockparty
          BIN=./blockparty-race RUNS=20 sh scripts/smoke.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # latest is the newest release; edge is the newest commit on main.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
      - name: Build (and publish on pushes to main or version tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release shows as its tag (v1.0.0); anything else as branch-commit.
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('{0}-{1}', github.ref_name, github.sha) }}
